<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadGuard Edge AI - Live Multi-Damage Road Scanner</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0f172a; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px; 
            margin: 0; 
            min-height: 100vh; 
            box-sizing: border-box;
        }
        .header { 
            width: 100%; 
            max-width: 440px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            box-sizing: border-box;
        }
        .back-btn { 
            background: #334155; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            text-decoration: none; 
            font-size: 0.85rem; 
        }
        #onboardModal { 
            background: #1e293b; 
            padding: 1.5rem; 
            border-radius: 8px; 
            width: 100%; 
            max-width: 440px; 
            box-sizing: border-box; 
            border: 1px solid #334155; 
            margin-top: 20px; 
        }
        #onboardModal h3 { margin-top: 0; color: #38bdf8; text-align: center; }
        
        #scannerContainer { 
            display: none; 
            width: 100%; 
            max-width: 440px; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box;
        }
        .vid-box { 
            width: 100%; 
            max-width: 440px; 
            margin-bottom: 15px; 
            box-sizing: border-box;
        }
        video, canvas { 
            width: 100%; 
            height: auto; 
            border-radius: 8px; 
            border: 2px solid #334155; 
            background: #1e293b; 
            box-sizing: border-box; 
            display: block;
        }
        .panel { 
            background: #1e293b; 
            padding: 1.2rem; 
            border-radius: 8px; 
            width: 100%; 
            max-width: 440px; 
            box-sizing: border-box; 
            border: 1px solid #334155; 
        }
        label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }
        input { 
            width: 100%; 
            padding: 0.7rem; 
            border-radius: 4px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: white; 
            margin-bottom: 15px; 
            box-sizing: border-box; 
        }
        button.action-btn { 
            background: #22c55e; 
            color: white; 
            border: none; 
            padding: 0.8rem; 
            border-radius: 4px; 
            width: 100%; 
            font-weight: bold; 
            cursor: pointer; 
            box-sizing: border-box;
            margin-top: 8px;
        }
        button.action-btn:hover { background: #16a34a; }
        .ai-badge { 
            margin-bottom: 12px; 
            padding: 10px; 
            background: #0f172a; 
            border: 1px solid #3b82f6; 
            border-radius: 4px; 
            font-size: 0.85rem; 
            color: #93c5fd; 
            text-align: center; 
            box-sizing: border-box;
        }
        .log { 
            margin-top: 12px; 
            font-size: 0.85rem; 
            background: #334155; 
            padding: 10px; 
            border-radius: 4px; 
            box-sizing: border-box;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
<link rel="stylesheet" href="css/style.css">
<style>
body{background:#f6f9f6;color:#17251f}
#onboardModal,.panel{background:#fff;color:#17251f;border:1px solid #e4ebe6;border-radius:14px;box-shadow:0 10px 30px #183d2508}
#onboardModal h3{color:#176b4b}
.header small,.panel small{color:#6d7b74}
.back-btn{background:#e9f4ed;color:#176b4b;border-radius:8px}
video,canvas{border:1px solid #dce5de;background:#edf3ee;border-radius:12px}
input{background:#fff;color:#17251f;border:1px solid #dce5de;border-radius:8px}
button.action-btn{background:#176b4b;border-radius:8px}
button.action-btn:hover{background:#10553b}
.ai-badge{background:#e9f4ed;border:1px solid #cfe2d4;color:#176b4b;border-radius:8px}
.log{background:#f2f6f2;color:#405449;border:1px solid #e4ebe6;border-radius:8px}
</style>
</head>
<body>

    <div id="onboardModal">
        <h3>Contributor Details</h3>
        <p style="font-size:0.85rem; color:#64748b; text-align:center;">Enter your details to start reporting. No account or password is needed.</p>
        <form id="contributorForm">
          <label for="contributorName">Full name</label><input id="contributorName" name="name" maxlength="100" required autocomplete="name" placeholder="Your full name">
          <label for="contributorPhone">Phone number</label><input id="contributorPhone" name="phone" type="tel" maxlength="20" required autocomplete="tel" placeholder="Your contact number">
          <label for="contributorEmail">Email (optional)</label><input id="contributorEmail" name="email" type="email" maxlength="254" autocomplete="email" placeholder="Your email address">
          <label for="contributorLocation">Location (optional)</label><input id="contributorLocation" name="location" maxlength="200" placeholder="Area / city">
          <button class="action-btn" type="submit">Continue to Road Scanner</button>
        </form>
        <p id="loginPrompt" role="status"></p>
        <a href="index.html" class="back-btn" style="display:block;text-align:center;margin-top:15px;background:transparent;color:#64748b;">← Back to Map</a>
    </div>

    <div id="scannerContainer">
        <div class="header">
            <div>
                <h3 style="margin:0;" id="welcomeHeader">Multi-Damage Scanner</h3>
                <small id="userMeta" style="color:#94a3b8;"></small>
            </div>
            <a href="index.html" class="back-btn">Exit</a>
        </div>

        <div class="vid-box">
            <video id="cam" autoplay playsinline muted></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <div class="panel">
            <div class="ai-badge" id="aiBadge">Edge AI: Loading model into device RAM...</div>

            <div style="font-size:0.85rem; color:#94a3b8; margin-bottom:8px;" id="localCountInfo">Stored Local Reports: 0</div>

            <button class="action-btn" onclick="sendReportsToPanel()" style="background:#3b82f6;">Send All Reports to Panel</button>
            <div class="log" id="logBox">Initializing GPS and Camera permissions...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script>
        let contributor = null;
        const video = document.getElementById('cam');
        const canvas = document.getElementById('canvas');
        const log = document.getElementById('logBox');
        const aiBadge = document.getElementById('aiBadge');

        let coords = { lat: null, lng: null };
        let ortSession = null;
        let isScanning = false;
        const MODEL_SIZE = 640;
        const DAMAGE_CLASSES = ['Longitudinal Crack', 'Transverse Crack', 'Alligator Crack', 'Pothole'];

        const BACKEND_URL = '/api/reports';

        function startContributorSession() {
            const form = document.getElementById('contributorForm');
            if (!form.reportValidity()) return;
            contributor = {
                name: document.getElementById('contributorName').value.trim(),
                phone: document.getElementById('contributorPhone').value.trim(),
                email: document.getElementById('contributorEmail').value.trim(),
                locationText: document.getElementById('contributorLocation').value.trim()
            };
            if (!contributor.name || !contributor.phone) return;
            document.getElementById('onboardModal').style.display = 'none';
            document.getElementById('scannerContainer').style.display = 'flex';
            document.getElementById('welcomeHeader').innerText = `Welcome, ${contributor.name}`;
            document.getElementById('userMeta').innerText = contributor.phone;
            updateLocalStorageCount();
            initGPS();
            initCameraAndModel();
        }

        document.getElementById('contributorForm').addEventListener('submit', event => {
            event.preventDefault();
            startContributorSession();
        });

        window.onload = () => updateLocalStorageCount();

        function initGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    pos => {
                        coords.lat = pos.coords.latitude;
                        coords.lng = pos.coords.longitude;
                        if (log) log.innerText = `GPS Locked: [${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)}]`;
                    },
                    () => { if (log) log.innerText = 'GPS permission denied or unavailable. Reports require a valid GPS fix.'; },
                    { enableHighAccuracy: true }
                );
            }
        }

        async function initCameraAndModel() {
            try {
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: { exact: 'environment' } } 
                    });
                } catch (err1) {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: true 
                    });
                }

                video.srcObject = stream;
                video.onloadeddata = async () => {
                    try {
                        ortSession = await ort.InferenceSession.create('./model/best.onnx', { executionProviders: ['wasm'] });
                        aiBadge.innerText = 'Edge AI Ready: Scanning multi-damages locally';
                        startAutoDetectionLoop();
                    } catch (err) {
                        console.error(err);
                        aiBadge.innerText = 'AI Error: Ensure /model/best.onnx is uploaded.';
                    }
                };
            } catch (err) {
                console.error("Camera Error:", err);
                if (log) {
                    log.innerText = `Camera Error: [${err.name}] ${err.message}`;
                }
                alert(`Camera access failed: ${err.message}. Please check browser permissions.`);
            }
        }

        async function analyzeFrameForMultipleDamages() {
            if (!ortSession || !video || video.readyState < 2) return [];

            const offscreen = document.createElement('canvas');
            offscreen.width = MODEL_SIZE;
            offscreen.height = MODEL_SIZE;
            const ctx = offscreen.getContext('2d');
            ctx.drawImage(video, 0, 0, MODEL_SIZE, MODEL_SIZE);
            const { data } = ctx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE);

            const floatData = new Float32Array(3 * MODEL_SIZE * MODEL_SIZE);
            const area = MODEL_SIZE * MODEL_SIZE;
            for (let i = 0; i < area; i++) {
                floatData[i] = data[i * 4] / 255.0;
                floatData[i + area] = data[i * 4 + 1] / 255.0;
                floatData[i + 2 * area] = data[i * 4 + 2] / 255.0;
            }

            const inputTensor = new ort.Tensor('float32', floatData, [1, 3, MODEL_SIZE, MODEL_SIZE]);
            const results = await ortSession.run({ [ortSession.inputNames[0]]: inputTensor });
            const output = results[ortSession.outputNames[0]].data;

            const numClasses = DAMAGE_CLASSES.length;
            const numBoxes = output.length / (4 + numClasses);
            let detectedDamages = [];

            for (let b = 0; b < numBoxes; b++) {
                let maxConf = 0;
                let bestIdx = 0;
                for (let c = 0; c < numClasses; c++) {
                    const score = output[(4 + c) * numBoxes + b];
                    if (score > maxConf) {
                        maxConf = score;
                        bestIdx = c;
                    }
                }
                // Threshold filter for valid bounding detection
                if (maxConf > 0.60) {
                    detectedDamages.push({
                        label: DAMAGE_CLASSES[bestIdx],
                        confidence: maxConf
                    });
                }
            }

            return detectedDamages;
        }

        function startAutoDetectionLoop() {
            setInterval(async () => {
                if (isScanning) return;
                isScanning = true;

                const detectedList = await analyzeFrameForMultipleDamages();
                if (detectedList.length > 0) {
                    const count = detectedList.length;
                    let severity = 'Normal Damage';
                    if (count > 10) {
                        severity = 'High Red Severity';
                    } else if (count > 4) {
                        severity = 'Medium';
                    }

                    aiBadge.innerText = `Detected ${count} damages (${severity})`;

                    // Automatically capture snapshot and store locally when a defect cluster is found
                    if (count >= 1) {
                        storeReportLocally(detectedList, severity);
                    }
                } else {
                    aiBadge.innerText = 'Scanning road locally... (Clear)';
                }

                setTimeout(() => { isScanning = false; }, 4000);
            }, 2000);
        }

        function storeReportLocally(damages, severity) {
            const latitude = coords.lat;
            const longitude = coords.lng;
            if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
                if (log) log.innerText = 'Waiting for a valid GPS fix. No fallback location is used.';
                return;
            }

            canvas.width = 480;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');
            if (video && video.readyState >= 2) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }
            const imageBase64 = canvas.toDataURL('image/jpeg', 0.6);

            const newReport = {
                contributor_name: contributor ? contributor.name : '',
                contributor_phone: contributor ? contributor.phone : '',
                contributor_email: contributor ? contributor.email : '',
                contributor_location: contributor ? contributor.locationText : '',
                latitude: latitude,
                longitude: longitude,
                severity: severity,
                damage_count: damages.length,
                damages_detected: damages,
                image_base64: imageBase64,
                timestamp: new Date().toISOString()
            };

            let localReports = JSON.parse(localStorage.getItem('roadguard_local_reports') || '[]');
            localReports.push(newReport);
            localStorage.setItem('roadguard_local_reports', JSON.stringify(localReports));

            updateLocalStorageCount();
            if (log) log.innerText = `Stored locally: ${damages.length} defect(s) [${severity}] at [${latitude.toFixed(4)}, ${longitude.toFixed(4)}]`;
        }

        function updateLocalStorageCount() {
            const localReports = JSON.parse(localStorage.getItem('roadguard_local_reports') || '[]');
            const infoEl = document.getElementById('localCountInfo');
            if (infoEl) infoEl.innerText = `Stored Local Reports: ${localReports.length}`;
        }

        async function sendReportsToPanel() {
            const localReports = JSON.parse(localStorage.getItem('roadguard_local_reports') || '[]');
            if (localReports.length === 0) {
                alert('No local reports stored to send.');
                return;
            }

            let successCount = 0;
            const failedReports = [];
            const failureReasons = [];
            for (let report of localReports) {
                try {
                    const response = await fetch(BACKEND_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({
                            contributor_name: report.contributor_name,
                            contributor_phone: report.contributor_phone,
                            contributor_email: report.contributor_email,
                            contributor_location: report.contributor_location,
                            latitude: report.latitude,
                            longitude: report.longitude,
                            severity: report.severity,
                            description: `Detected ${report.damage_count} road damage item(s) by on-device AI.`,
                            damage_type: `Multi-Damage Count: ${report.damage_count}`,
                            image_base64: report.image_base64
                        })
                    });
                    const rawBody = await response.text();
                    let result = {};
                    try { result = rawBody ? JSON.parse(rawBody) : {}; } catch (_) {}
                    if (response.ok && result.success) {
                        successCount++;
                    } else {
                        failedReports.push(report);
                        failureReasons.push(`HTTP ${response.status}: ${result.message || rawBody.slice(0, 180) || 'Server rejected the report'}`);
                    }
                } catch (err) {
                    console.error("Sync error:", err);
                    failedReports.push(report);
                    failureReasons.push(err.message || 'Network request failed');
                }
            }

            localStorage.setItem('roadguard_local_reports', JSON.stringify(failedReports));
            updateLocalStorageCount();
            if (successCount > 0) {
                alert(`Successfully sent ${successCount} report(s). ${failedReports.length} report(s) remain saved locally.`);
                if (log) log.innerText = 'Upload finished. Any failed reports remain saved locally.';
            } else {
                const reason = failureReasons[0] || 'Unknown upload error';
                if (log) log.innerText = `Upload failed: ${reason}. ${failedReports.length} report(s) are still saved on this device.`;
                alert(`Report upload failed: ${reason}. Your ${failedReports.length} report(s) are still saved locally. Do not clear browser data.`);
            }
        }
    </script>
</body>
</html>
