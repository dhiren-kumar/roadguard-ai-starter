<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadGuard Edge AI - Live Road Scanner</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0f172a; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px; 
            margin: 0; 
            min-height: 100vh; 
            box-sizing: border-box;
        }
        .header { 
            width: 100%; 
            max-width: 440px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            box-sizing: border-box;
        }
        .back-btn { 
            background: #334155; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            text-decoration: none; 
            font-size: 0.85rem; 
        }
        #onboardModal { 
            background: #1e293b; 
            padding: 1.5rem; 
            border-radius: 8px; 
            width: 100%; 
            max-width: 440px; 
            box-sizing: border-box; 
            border: 1px solid #334155; 
            margin-top: 20px; 
        }
        #onboardModal h3 { margin-top: 0; color: #38bdf8; text-align: center; }
        
        #scannerContainer { 
            display: none; 
            width: 100%; 
            max-width: 440px; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box;
        }
        .vid-box { 
            width: 100%; 
            max-width: 440px; 
            margin-bottom: 15px; 
            box-sizing: border-box;
        }
        video, canvas { 
            width: 100%; 
            height: auto; 
            border-radius: 8px; 
            border: 2px solid #334155; 
            background: #1e293b; 
            box-sizing: border-box; 
            display: block;
        }
        .panel { 
            background: #1e293b; 
            padding: 1.2rem; 
            border-radius: 8px; 
            width: 100%; 
            max-width: 440px; 
            box-sizing: border-box; 
            border: 1px solid #334155; 
        }
        label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }
        input, select { 
            width: 100%; 
            padding: 0.7rem; 
            border-radius: 4px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: white; 
            margin-bottom: 15px; 
            box-sizing: border-box; 
        }
        button.action-btn { 
            background: #22c55e; 
            color: white; 
            border: none; 
            padding: 0.8rem; 
            border-radius: 4px; 
            width: 100%; 
            font-weight: bold; 
            cursor: pointer; 
            box-sizing: border-box;
        }
        button.action-btn:hover { background: #16a34a; }
        .ai-badge { 
            margin-bottom: 12px; 
            padding: 10px; 
            background: #0f172a; 
            border: 1px solid #3b82f6; 
            border-radius: 4px; 
            font-size: 0.85rem; 
            color: #93c5fd; 
            text-align: center; 
            box-sizing: border-box;
        }
        .log { 
            margin-top: 12px; 
            font-size: 0.85rem; 
            background: #334155; 
            padding: 10px; 
            border-radius: 4px; 
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="onboardModal">
        <h3>Contributor Registration</h3>
        <p style="font-size:0.85rem; color:#94a3b8; text-align:center;">Enter your details to start local AI road scanning.</p>
        
        <label for="contribName">Your Full Name</label>
        <input type="text" id="contribName" placeholder="e.g. Rahul Sharma" required>

        <label for="contribPhone">Phone Number</label>
        <input type="tel" id="contribPhone" placeholder="e.g. 9876543210" required>

        <button class="action-btn" onclick="startContributorSession()">Start Edge AI Scanner</button>
        <a href="index.html" class="back-btn" style="display:block; text-align:center; margin-top:15px; background:transparent; color:#94a3b8;">← Back to Map</a>
    </div>

    <div id="scannerContainer">
        <div class="header">
            <div>
                <h3 style="margin:0;" id="welcomeHeader">Road Scanner</h3>
                <small id="userMeta" style="color:#94a3b8;"></small>
            </div>
            <a href="index.html" class="back-btn">Exit</a>
        </div>

        <div class="vid-box">
            <video id="cam" autoplay playsinline muted></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <div class="panel">
            <div class="ai-badge" id="aiBadge">Edge AI: Loading model into device RAM...</div>

            <label for="severitySelect">Detected Severity (Auto-Updated):</label>
            <select id="severitySelect">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="Severe">Severe</option>
            </select>

            <button class="action-btn" onclick="manualCaptureAndReport()">Manual Capture & Report</button>
            <div class="log" id="logBox">Initializing GPS and Camera permissions...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script>
        let contributor = null;
        const video = document.getElementById('cam');
        const canvas = document.getElementById('canvas');
        const log = document.getElementById('logBox');
        const aiBadge = document.getElementById('aiBadge');

        let coords = { lat: null, lng: null };
        let ortSession = null;
        let isAutoReporting = false;
        const MODEL_SIZE = 640;
        const DAMAGE_CLASSES = ['Longitudinal Crack', 'Transverse Crack', 'Alligator Crack', 'Pothole'];

        // Automatically point to your live backend server or fallback to local
        const BACKEND_URL = window.location.hostname.includes('github.io') 
            ? 'https://roadguard-backend.onrender.com/api/reports' 
            : '/api/reports';

        function startContributorSession() {
            const name = document.getElementById('contribName').value.trim();
            const phone = document.getElementById('contribPhone').value.trim();

            if (!name || !phone) {
                alert('Please enter both your name and phone number.');
                return;
            }

            contributor = { name, phone };
            localStorage.setItem('roadguard_contributor', JSON.stringify(contributor));

            document.getElementById('onboardModal').style.display = 'none';
            document.getElementById('scannerContainer').style.display = 'flex';
            document.getElementById('userMeta').innerText = `${name} (${phone})`;

            initGPS();
            initCameraAndModel();
        }

        window.onload = () => {
            const saved = localStorage.getItem('roadguard_contributor');
            if (saved) {
                contributor = JSON.parse(saved);
                document.getElementById('contribName').value = contributor.name;
                document.getElementById('contribPhone').value = contributor.phone;
            }
        };

        function initGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    pos => {
                        coords.lat = pos.coords.latitude;
                        coords.lng = pos.coords.longitude;
                        if (log) log.innerText = `GPS Locked: [${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)}]`;
                    },
                    () => { if (log) log.innerText = 'GPS permission denied. Using fallback location.'; },
                    { enableHighAccuracy: true }
                );
            }
        }

        async function initCameraAndModel() {
            try {
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: { exact: 'environment' } } 
                    });
                } catch (err1) {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: true 
                    });
                }

                video.srcObject = stream;
                video.onloadeddata = async () => {
                    try {
                        ortSession = await ort.InferenceSession.create('./model/best.onnx', { executionProviders: ['wasm'] });
                        aiBadge.innerText = 'Edge AI Ready: Running locally in device RAM';
                        startAutoDetectionLoop();
                    } catch (err) {
                        console.error(err);
                        aiBadge.innerText = 'AI Error: Ensure /model/best.onnx is uploaded.';
                    }
                };
            } catch (err) {
                console.error("Camera Error:", err);
                if (log) {
                    log.innerText = `Camera Error: [${err.name}] ${err.message}`;
                }
                alert(`Camera access failed: ${err.message}. Please check browser permissions.`);
            }
        }

        async function analyzeFrameLocally() {
            if (!ortSession || !video || video.readyState < 2) return null;

            const offscreen = document.createElement('canvas');
            offscreen.width = MODEL_SIZE;
            offscreen.height = MODEL_SIZE;
            const ctx = offscreen.getContext('2d');
            ctx.drawImage(video, 0, 0, MODEL_SIZE, MODEL_SIZE);
            const { data } = ctx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE);

            const floatData = new Float32Array(3 * MODEL_SIZE * MODEL_SIZE);
            const area = MODEL_SIZE * MODEL_SIZE;
            for (let i = 0; i < area; i++) {
                floatData[i] = data[i * 4] / 255.0;
                floatData[i + area] = data[i * 4 + 1] / 255.0;
                floatData[i + 2 * area] = data[i * 4 + 2] / 255.0;
            }

            const inputTensor = new ort.Tensor('float32', floatData, [1, 3, MODEL_SIZE, MODEL_SIZE]);
            const results = await ortSession.run({ [ortSession.inputNames[0]]: inputTensor });
            const output = results[ortSession.outputNames[0]].data;

            let maxConf = 0;
            let bestIdx = 0;
            const numClasses = DAMAGE_CLASSES.length;
            const numBoxes = output.length / (4 + numClasses);

            for (let b = 0; b < numBoxes; b++) {
                for (let c = 0; c < numClasses; c++) {
                    const score = output[(4 + c) * numBoxes + b];
                    if (score > maxConf) {
                        maxConf = score;
                        bestIdx = c;
                    }
                }
            }

            return { label: DAMAGE_CLASSES[bestIdx] || 'Road Damage', confidence: maxConf };
        }

        function startAutoDetectionLoop() {
            setInterval(async () => {
                if (isAutoReporting) return;
                const res = await analyzeFrameLocally();
                if (!res) return;

                const pct = (res.confidence * 100).toFixed(1);
                const severitySelect = document.getElementById('severitySelect');

                if (res.confidence > 0.60) {
                    aiBadge.innerText = `AI Detected: ${res.label} (${pct}%)`;
                    severitySelect.value = res.confidence > 0.85 ? 'Severe' : 'Medium';

                    if (res.confidence > 0.82) {
                        isAutoReporting = true;
                        aiBadge.innerText = `Auto-capturing ${res.label} report...`;
                        await submitReport(res.label, severitySelect.value);
                        setTimeout(() => { isAutoReporting = false; }, 12000);
                    }
                } else {
                    aiBadge.innerText = 'Scanning road locally... (Clear)';
                }
            }, 1500);
        }

        async function manualCaptureAndReport() {
            const severity = document.getElementById('severitySelect').value;
            await submitReport('Manual Damage Scan', severity);
        }

        async function submitReport(damageType, severity) {
            // Use live GPS or fallback default coordinates if GPS isn't locked yet
            const latitude = coords.lat || 20.2961;
            const longitude = coords.lng || 85.8245;

            canvas.width = 480;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');
            if (video && video.readyState >= 2) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }

            const imageBase64 = canvas.toDataURL('image/jpeg', 0.6);

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contributor_name: contributor ? contributor.name : 'Anonymous',
                        contributor_phone: contributor ? contributor.phone : '0000000000',
                        latitude: latitude,
                        longitude: longitude,
                        severity: severity,
                        damage_type: damageType,
                        image_base64: imageBase64
                    })
                });
                const data = await response.json();
                if (data.duplicate) {
                    if (log) log.innerText = data.message;
                } else {
                    alert(data.message || 'Report successfully submitted to Admin database!');
                    if (log) log.innerText = 'Report successfully submitted to Admin!';
                }
            } catch (err) {
                console.error("Submission error:", err);
                alert('Failed to connect to backend server. Ensure backend is running.');
                if (log) log.innerText = 'Server connection failed.';
            }
        }
    </script>
</body>
</html>
