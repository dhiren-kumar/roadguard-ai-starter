<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f8f5">
<title>RoadGuard AI · Edge Road Monitoring</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="css/style.css">
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:#17251f;font-family:Arial,sans-serif}
main{width:min(100% - 28px,900px);margin:22px auto 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-weight:800;color:#176b4b;font-size:18px}.exit{color:#176b4b;text-decoration:none;font-size:14px;padding:9px 13px;border-radius:9px;background:#e8f2eb}
h1{font-size:clamp(23px,5vw,32px);margin:0 0 7px}.sub{color:#64746a;margin:0 0 18px;font-size:14px}
.camera{position:relative;background:#101b16;border-radius:16px;overflow:hidden;min-height:220px;aspect-ratio:16/10;display:grid;place-items:center}
#camera{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;background:#101b16}
#photo{display:none;width:100%;max-height:520px;object-fit:contain;background:#101b16}
#placeholder{color:#d6e4da;text-align:center;padding:24px;z-index:1}
.status{margin:14px 0;padding:13px 15px;border:1px solid #dce8df;background:#fff;border-radius:11px;font-size:13px;line-height:1.55}
.status strong{display:block;margin-bottom:4px;color:#176b4b}.status p{margin:0;color:#506157}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
button{border:0;border-radius:11px;padding:15px 12px;font-size:15px;font-weight:700;cursor:pointer;background:#176b4b;color:#fff;min-height:52px}
button:disabled{opacity:.48;cursor:not-allowed}#submitBtn{background:#2458a6}
#result{margin-top:14px;padding:13px 15px;border-radius:11px;background:#fff;border:1px solid #dce8df;font-size:13px;line-height:1.5;min-height:46px}
#result:empty{display:none}.meta{font-size:12px;color:#718076;margin-top:14px;text-align:center}
@media(max-width:520px){main{width:min(100% - 20px,900px);margin-top:14px}.actions{grid-template-columns:1fr}.camera{aspect-ratio:4/3;min-height:210px}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<script defer src="dashboard.js"></script>
</head>
<body>
<main>
 <div class="top"><div class="brand">ROADGUARD AI</div><a class="exit" href="index.html">Exit</a></div>
 <h1>Live Road Monitoring</h1>
 <p class="sub">Edge AI road-damage detection · Processing on this device</p>
 <section class="camera" aria-label="Road camera preview">
  <video id="camera" autoplay muted playsinline></video>
  <img id="photo" alt="Captured road evidence">
  <div id="placeholder">Starting camera…</div>
 </section>
 <section class="status" aria-live="polite">
  <strong id="modelStatus">Loading RoadGuard AI into device memory…</strong>
  <p id="cameraStatus">Requesting camera permission…</p>
  <p id="locationStatus">Requesting live location permission…</p>
 </section>
 <div class="actions">
  <button id="captureBtn" type="button" disabled>Capture Road Damage</button>
  <button id="submitBtn" type="button" disabled>Submit Public Report</button>
 </div>
 <div id="result" role="status" aria-live="polite"></div>
 <p class="meta" id="contributorMeta"></p>
</main>
</body>
</html>
