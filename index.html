<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadGuard - Public Road Condition & Progress Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #0f172a; color: white; }
        header { background: #1e293b; padding: 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h2 { margin: 0; font-size: 1.2rem; color: #38bdf8; }
        .nav-links { display: flex; gap: 12px; }
        .nav-links a { background: #3b82f6; color: white; padding: 0.5rem 1rem; border-radius: 4px; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        .nav-links a:hover { background: #2563eb; }
        .search-bar { padding: 0.75rem 1rem; background: #1e293b; display: flex; gap: 10px; border-bottom: 1px solid #334155; }
        .search-bar input { padding: 0.5rem; flex: 1; max-width: 350px; border: 1px solid #475569; border-radius: 4px; background: #0f172a; color: white; }
        .search-bar button { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        #map { flex-grow: 1; width: 100%; }
        .legend { background: #1e293b; color: white; padding: 10px 14px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-size: 12px; line-height: 1.8; border: 1px solid #334155; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    </style>
</head>
<body>
    <!-- Report Panel Section -->
<section class="report-panel-container" style="padding: 20px; max-width: 1200px; margin: auto;">
    <h2>Live Road Hazard Reports</h2>
    <div id="reports-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 15px;">
        <!-- Dynamic report cards will load here -->
    </div>
</section>
    <header>
        <h2>RoadGuard Live Progress Map</h2>
        <div class="nav-links">
            <a href="dashboard.html" style="background:#22c55e;">Contribute / Scan Road</a>
            <a href="login.html">Admin Portal</a>
        </div>
    </header>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search city or area (e.g. Bhubaneswar, Keonjhar)...">
        <button onclick="searchLocation()">Search Location</button>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([20.2961, 85.8245], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <b>Report Progress Status</b><br>
                <span class="dot" style="background:red;"></span> Severe / Approved<br>
                <span class="dot" style="background:orange;"></span> Under Construction<br>
                <span class="dot" style="background:green;"></span> Completed / Resolved
            `;
            return div;
        };
        legend.addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        async function loadPublicReports() {
            try {
                const res = await fetch('/api/reports/public');
                const reports = await res.json();
                markersLayer.clearLayers();

                reports.forEach(r => {
                    let color = 'red';
                    if (r.status === 'under-construction') color = 'orange';
                    if (r.status === 'completed') color = 'green';

                    const marker = L.circleMarker([r.latitude, r.longitude], {
                        radius: 10, fillColor: color, color: '#000', weight: 1, fillOpacity: 0.9
                    });

                    marker.bindPopup(`
                        <b>Damage: ${r.damage_type} (${r.severity})</b><br>
                        Status: <b style="text-transform:uppercase; color:${color};">${r.status}</b><br>
                        <small><b>Location:</b> ${r.location_name}</small><br>
                        <img src="${r.image_base64}" width="160px" style="margin-top:6px;border-radius:4px;"/><br>
                        <small>Date: ${new Date(r.timestamp).toLocaleString()}</small>
                    `);
                    markersLayer.addLayer(marker);
                });
            } catch (err) {
                console.error('Failed to load public reports:', err);
            }
        }

        function searchLocation() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        map.setView([data[0].lat, data[0].lon], 14);
                    } else {
                        alert('Location not found.');
                    }
                });
        }

        loadPublicReports();
        setInterval(loadPublicReports, 10000);
    </script>
</body>
</html>
