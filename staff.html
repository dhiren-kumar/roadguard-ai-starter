<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoadGuard AI Staff Portal</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8f5;color:#183528;font-family:Arial}header{background:#145b40;color:white;padding:18px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between}header h1{font-size:20px;margin:0}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.welcome,.job,.empty{background:white;border:1px solid #dce8df;border-radius:12px;padding:18px;margin-bottom:14px}.welcome{background:#e5f2e9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.muted{color:#64756b;font-size:13px}button{cursor:pointer;background:#176b4b;color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:bold}.pill{display:inline-block;background:#fff1d6;color:#805000;padding:4px 8px;border-radius:20px;font-size:12px}.dialog{width:min(94vw,680px);max-height:90vh;overflow:auto;border:0;border-radius:14px;padding:22px}.dialog::backdrop{background:#10251acc}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.photos img{width:100%;height:120px;object-fit:cover;border-radius:8px}.field{display:block;margin:14px 0;font-weight:bold;font-size:14px}.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #cbd9ce;border-radius:8px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end}.secondary{background:#e7eee9;color:#234b36}</style></head><body><header><h1>RoadGuard AI · Maintenance Staff</h1><button id="logout">Logout</button></header><main class="wrap"><section class="welcome"><b id="welcome">Welcome</b><p class="muted">Open your assigned jobs, visit the road location, then submit repair notes and photo evidence.</p></section><div id="jobs" class="grid"><p>Loading assigned jobs…</p></div></main><dialog id="dlg" class="dialog"><h2 id="title">Repair job</h2><p id="meta" class="muted"></p><p id="desc"></p><a id="map" target="_blank" rel="noopener">Open location in map</a><h3>Original reported photos</h3><div id="original" class="photos"></div><hr><h3>Submit repair update</h3><form id="update"><label class="field">Progress<select id="progress"><option value="in_progress">Work in progress</option><option value="completed">Completed — send to admin for verification</option><option value="unable">Unable to repair — request review</option></select></label><label class="field">Repair notes<textarea id="note" rows="4" maxlength="1000" required></textarea></label><label class="field">Repair photos (1–2 required)<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple required></label><label class="field">Photo caption<input id="caption" maxlength="120"></label><div class="actions"><button type="button" id="close" class="secondary">Close</button><button id="send">Submit update</button></div></form><h3>Previous repair photos</h3><div id="previous" class="photos"></div></dialog><script>
const token=sessionStorage.getItem('roadguard_staff_token'),user=JSON.parse(sessionStorage.getItem('roadguard_staff_user')||'null');let jobs=[],active=null;const $=id=>document.getElementById(id),dlg=$('dlg');
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d;}
function render(){const host=$('jobs');host.replaceChildren();if(!jobs.length){host.textContent='No jobs assigned yet. Contact your administrator.';return;}jobs.forEach(j=>{const card=document.createElement('article');card.className='job';const h=document.createElement('h3');h.textContent=j.damage_type||'Road damage';const p=document.createElement('p');p.className='muted';p.textContent=(j.location_name||'Location not specified')+' · '+(j.severity||'')+' · '+(j.priority||'medium')+' priority';const badge=document.createElement('span');badge.className='pill';badge.textContent=j.repair_verification_pending?'Awaiting admin verification':j.status;const b=document.createElement('button');b.textContent='Open job';b.onclick=()=>openJob(j);card.append(h,badge,p,b);host.append(card);});}
function addImages(host,items){host.replaceChildren();(items||[]).forEach(p=>{if(!p.image_url)return;const im=document.createElement('img');im.src=p.image_url;im.alt=p.caption||'Road evidence';host.append(im);});}
function openJob(j){active=j;$('title').textContent=j.damage_type||'Road damage';$('meta').textContent=(j.location_name||'Location not specified')+' · '+j.status+' · '+j.severity+' severity';$('desc').textContent=j.description||'';$('map').href='https://maps.google.com/?q='+encodeURIComponent(j.latitude+','+j.longitude);addImages($('original'),j.evidence_photos);addImages($('previous'),j.repair_photos);$('note').value='';$('files').value='';dlg.showModal();}
async function load(){const d=await api('/api/reports/assigned');jobs=d.data||[];render();}
$('close').onclick=()=>dlg.close();$('logout').onclick=()=>{sessionStorage.removeItem('roadguard_staff_token');sessionStorage.removeItem('roadguard_staff_user');location.href='staff-login.html';};
$('update').addEventListener('submit',async e=>{e.preventDefault();if(!active)return;const files=[...$('files').files];if(files.length<1||files.length>2){alert('Choose one or two photos.');return;}const b=$('send');b.disabled=true;b.textContent='Uploading…';try{const caption=$('caption').value.trim();const repair_photos=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{if(file.size>3.7*1024*1024)return reject(Error(file.name+' exceeds 3.7 MB'));const fr=new FileReader();fr.onload=()=>resolve({image_base64:fr.result,caption});fr.onerror=()=>reject(Error('Could not read '+file.name));fr.readAsDataURL(file);})));await api('/api/reports/'+encodeURIComponent(active.id)+'/repair-update',{method:'PATCH',body:JSON.stringify({progress:$('progress').value,note:$('note').value.trim(),repair_photos})});alert('Repair update submitted. Your administrator can review the photos and notes.');dlg.close();await load();}catch(err){alert(err.message);}finally{b.disabled=false;b.textContent='Submit update';}});
(async()=>{if(!token||!user||user.role!=='staff'){location.href='staff-login.html';return;}try{const me=await api('/api/auth/me');if(me.user.role!=='staff')throw Error('Staff access required');$('welcome').textContent='Welcome, '+me.user.name;await load();setInterval(()=>load().catch(()=>{}),30000);}catch(e){sessionStorage.removeItem('roadguard_staff_token');location.href='staff-login.html';}})();
</script></body></html>
