<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoadGuard AI Staff Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#eff6f1;font-family:Arial;color:#173526}.card{width:min(100%,420px);background:white;padding:28px;border-radius:16px;box-shadow:0 15px 50px #123b2418}h1{color:#176b4b}label{display:block;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd9ce;border-radius:8px}button{width:100%;padding:13px;margin-top:18px;background:#176b4b;color:white;border:0;border-radius:8px;font-weight:bold}.status{color:#b45309;min-height:24px}a{color:#176b4b}</style></head><body><main class="card"><p style="color:#176b4b;font-weight:bold">ROADGUARD AI · FIELD OPERATIONS</p><h1>Maintenance Staff Login</h1><p>Sign in using the staff account created by your administrator.</p><form id="f"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button id="btn">Sign in</button></form><p id="status" class="status"></p><a href="index.html">Back to public map</a></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btn'),s=document.getElementById('status');b.disabled=true;s.textContent='Signing in…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Login failed');if(d.user.role!=='staff')throw Error('This page is only for maintenance staff.');sessionStorage.setItem('roadguard_staff_token',d.token);sessionStorage.setItem('roadguard_staff_user',JSON.stringify(d.user));location.href='staff.html';}catch(x){s.textContent=x.message;}finally{b.disabled=false;}});</script></body></html>
