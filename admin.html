<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadGuard - Admin Management Console</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 1rem 1.5rem; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
        header h2 { margin: 0; color: #38bdf8; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .table-container { background: #1e293b; border-radius: 8px; border: 1px solid #334155; overflow-x: auto; padding: 1rem; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #38bdf8; }
        img { border-radius: 4px; object-fit: cover; }
        select { background: #0f172a; color: white; border: 1px solid #475569; padding: 6px; border-radius: 4px; }
        .badge-severe { background: #7f1d1d; color: #fca5a5; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .badge-medium { background: #78350f; color: #fde047; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .badge-low { background: #14532d; color: #86efac; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h2>Admin Review & Progress Console</h2>
        <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
    </header>

    <div class="table-container">
        <h3 style="margin-top:0; color:#cbd5e1;">Submitted Road Reports (Sorted by Highest Severity)</h3>
        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Damage & Severity</th>
                    <th>Contributor</th>
                    <th>Location / Road Name</th>
                    <th>Timestamp</th>
                    <th>Status Progress</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <tr><td colspan="6" style="text-align:center;">Loading reports...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const adminUser = JSON.parse(localStorage.getItem('adminUser'));
        if (!adminUser || adminUser.role !== 'admin') {
            window.location.href = 'login.html';
        }

        function logoutAdmin() {
            localStorage.removeItem('adminUser');
            window.location.href = 'login.html';
        }

        async function loadAdminReports() {
            try {
                const res = await fetch('/api/reports');
                let reports = await res.json();

                const severityRank = { 'Severe': 3, 'Medium': 2, 'Low': 1 };
                reports.sort((a, b) => (severityRank[b.severity] || 0) - (severityRank[a.severity] || 0));

                const tbody = document.getElementById('reportTableBody');
                tbody.innerHTML = '';

                if (reports.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8;">No road damage reports submitted yet.</td></tr>';
                    return;
                }

                reports.forEach(r => {
                    let badgeClass = 'badge-medium';
                    if (r.severity === 'Severe') badgeClass = 'badge-severe';
                    if (r.severity === 'Low') badgeClass = 'badge-low';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><img src="${r.image_base64}" width="100px" height="70px"/></td>
                        <td>
                            <b>${r.damage_type}</b><br>
                            <span class="${badgeClass}">${r.severity}</span>
                        </td>
                        <td>
                            ${r.contributor_name}<br>
                            <small style="color:#94a3b8;">📞 ${r.contributor_phone}</small>
                        </td>
                        <td>
                            <small>${r.location_name}</small><br>
                            <a href="https://maps.google.com/?q=${r.latitude},${r.longitude}" target="_blank" style="font-size:0.8rem; color:#38bdf8;">Map Coordinates</a>
                        </td>
                        <td><small>${new Date(r.timestamp).toLocaleString()}</small></td>
                        <td>
                            <select onchange="updateStatus('${r.id}', this.value)">
                                <option value="pending" ${r.status === 'pending' ? 'selected' : ''}>Pending Review</option>
                                <option value="under-construction" ${r.status === 'under-construction' ? 'selected' : ''}>Under Construction</option>
                                <option value="completed" ${r.status === 'completed' ? 'selected' : ''}>Completed / Resolved</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('Error loading admin reports:', err);
            }
        }

        async function updateStatus(id, newStatus) {
            try {
                const res = await fetch(`/api/reports/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (data.success) {
                    loadAdminReports();
                } else {
                    alert('Failed to update status.');
                }
            } catch (err) {
                alert('Server connection error.');
            }
        }

        loadAdminReports();
        setInterval(loadAdminReports, 10000);
    </script>
</body>
</html>
