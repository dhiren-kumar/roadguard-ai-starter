<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadGuard - Admin Management Console</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 1rem 1.5rem; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
        header h2 { margin: 0; color: #38bdf8; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .table-container { background: #1e293b; border-radius: 8px; border: 1px solid #334155; overflow-x: auto; padding: 1rem; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #38bdf8; }
        img { border-radius: 4px; object-fit: cover; }
        select { background: #0f172a; color: white; border: 1px solid #475569; padding: 6px; border-radius: 4px; }
        .badge-severe { background: #7f1d1d; color: #fca5a5; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .badge-medium { background: #78350f; color: #fde047; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .badge-low { background: #14532d; color: #86efac; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    </style>
<link rel="stylesheet" href="css/style.css">
<style>
body{background:#f6f9f6;color:#17251f}
header,.table-container{background:#fff;color:#17251f;border:1px solid #e4ebe6;border-radius:12px;box-shadow:0 10px 30px #183d2508}
header h2{color:#176b4b}
th{background:#e9f4ed;color:#176b4b}
th,td{border-bottom:1px solid #e4ebe6}
select{background:#fff;color:#17251f;border:1px solid #dce5de;border-radius:8px}
.logout-btn{background:#176b4b;border-radius:8px}
a{color:#176b4b}
</style>
</head>
<body>
    <header>
        <h2>Admin Review & Progress Console</h2>
        <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
    </header>

    <div class="table-container">
        <h3 style="margin-top:0; color:#cbd5e1;">Submitted Road Reports (Sorted by Highest Severity)</h3>
        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Damage & Severity</th>
                    <th>Contributor</th>
                    <th>Location / Road Name</th>
                    <th>Timestamp</th>
                    <th>Status Progress</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <tr><td colspan="6" style="text-align:center;">Loading reports...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = sessionStorage.getItem('roadguard_token');
        const currentUser = JSON.parse(sessionStorage.getItem('roadguard_user') || 'null');
        const tbody = document.getElementById('reportTableBody');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }
        async function api(path, options = {}) {
            const response = await fetch(path, {
                ...options,
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...(options.headers || {}) }
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Request failed.');
            return data;
        }
        async function verifyAdmin() {
            if (!token || !currentUser || currentUser.role !== 'admin') {
                window.location.href = 'login.html?mode=admin'; return false;
            }
            try {
                const data = await api('/api/auth/me');
                if (data.user.role !== 'admin') throw new Error('Admin access required.');
                return true;
            } catch (error) {
                sessionStorage.clear(); window.location.href = 'login.html?mode=admin'; return false;
            }
        }
        function logoutAdmin() {
            sessionStorage.removeItem('roadguard_token');
            sessionStorage.removeItem('roadguard_user');
            window.location.href = 'login.html?mode=admin';
        }
        async function loadAdminReports() {
            try {
                const result = await api('/api/reports');
                const reports = result.data || [];
                const rank = { high: 3, medium: 2, low: 1 };
                reports.sort((a,b) => (rank[b.severity] || 0) - (rank[a.severity] || 0));
                tbody.innerHTML = '';
                if (!reports.length) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">No road damage reports yet.</td></tr>';
                    return;
                }
                reports.forEach(r => {
                    const severity = String(r.severity || 'medium').toLowerCase();
                    const badge = severity === 'high' ? 'badge-severe' : (severity === 'low' ? 'badge-low' : 'badge-medium');
                    const coords = `${r.latitude},${r.longitude}`;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${r.image_base64 ? `<img src="${escapeHtml(r.image_base64)}" width="100" height="70" alt="Road damage">` : 'No image'}</td>
                        <td><b>${escapeHtml(r.damage_type)}</b><br><span class="${badge}">${escapeHtml(severity)}</span></td>
                        <td>${escapeHtml(r.contributor_name)}</td>
                        <td><a href="https://maps.google.com/?q=${encodeURIComponent(coords)}" target="_blank" rel="noopener">View location</a><br><small>${escapeHtml(coords)}</small></td>
                        <td><small>${escapeHtml(new Date(r.timestamp).toLocaleString())}</small></td>
                        <td><select aria-label="Report status" onchange="updateStatus('${escapeHtml(r.id)}',this.value)">
                            <option value="pending" ${r.status==='pending'?'selected':''}>Pending</option>
                            <option value="approved" ${r.status==='approved'?'selected':''}>Approved</option>
                            <option value="under-construction" ${r.status==='under-construction'?'selected':''}>Under construction</option>
                            <option value="resolved" ${r.status==='resolved'?'selected':''}>Resolved</option>
                            <option value="rejected" ${r.status==='rejected'?'selected':''}>Rejected</option>
                        </select></td>`;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="6">${escapeHtml(error.message)}</td></tr>`;
            }
        }
        async function updateStatus(id, status) {
            try {
                await api(`/api/reports/${encodeURIComponent(id)}/status`, {
                    method: 'PATCH', body: JSON.stringify({ status })
                });
                await loadAdminReports();
            } catch (error) { alert(error.message); }
        }
        (async () => {
            if (await verifyAdmin()) {
                await loadAdminReports();
                setInterval(loadAdminReports, 15000);
            }
        })();
    </script>
</body>
</html>
