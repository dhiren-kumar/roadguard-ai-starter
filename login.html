<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoadGuard AI - Sign in</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
.card{background:#1e293b;padding:28px;border:1px solid #334155;border-radius:12px;width:100%;max-width:420px}
h1{color:#38bdf8;text-align:center;font-size:24px}p{color:#cbd5e1;font-size:14px}
label{display:block;margin:14px 0 6px;color:#cbd5e1;font-size:14px}
input{width:100%;padding:12px;border:1px solid #475569;border-radius:6px;background:#0f172a;color:white}
button{width:100%;padding:12px;margin-top:18px;border:0;border-radius:6px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
.switch{background:transparent;border:1px solid #475569}.status{min-height:22px;color:#fbbf24;margin-top:12px}
a{color:#7dd3fc}
</style><link rel="stylesheet" href="css/style.css">
<style>
body{background:#f6f9f6;color:#17251f;display:grid;place-items:center;min-height:100vh}
.card{background:#fff;border:1px solid #e4ebe6;border-radius:14px;box-shadow:0 16px 44px #183d2510;color:#17251f}
h1{color:#176b4b}p{color:#6d7b74}label{color:#34483b}
input{background:#fff;color:#17251f;border:1px solid #dce5de;border-radius:8px}
button{background:#176b4b;border-radius:8px}button:hover{background:#10553b}
.switch{background:#fff;color:#176b4b;border:1px solid #b9d3c4}.status{color:#176b4b}a{color:#176b4b}
</style>
</head>
<body><main class="card">
<h1>RoadGuard AI</h1><p id="intro">Sign in to your account to report road damage or manage reports.</p>
<form id="authForm">
<div id="nameWrap" hidden><label for="name">Full name</label><input id="name" autocomplete="name"></div>
<div id="locationWrap" hidden><label for="locationText">Location (optional)</label><input id="locationText" maxlength="200"></div>
<label for="email">Email</label><input id="email" type="email" required autocomplete="email">
<label for="password">Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password">
<button id="submitBtn" type="submit">Sign in</button>
</form>
<button class="switch" id="toggle" type="button">Create contributor account</button>
<div class="status" id="status" role="status"></div>
<p><a href="index.html">← Back to public map</a></p>
</main>
<script>
let registering=false;
const form=document.getElementById("authForm");
const statusEl=document.getElementById("status");
document.getElementById("toggle").addEventListener("click",()=>{
 registering=!registering;
 document.getElementById("nameWrap").hidden=!registering;
 document.getElementById("locationWrap").hidden=!registering;
 document.getElementById("intro").textContent=registering?"Create a contributor account. Verify your email before signing in.":"Sign in to your account to report road damage or manage reports.";
 document.getElementById("submitBtn").textContent=registering?"Register":"Sign in";
 document.getElementById("toggle").textContent=registering?"I already have an account":"Create contributor account";
 document.getElementById("password").autocomplete=registering?"new-password":"current-password";
 statusEl.textContent="";
});
form.addEventListener("submit",async event=>{
 event.preventDefault();statusEl.textContent="Please wait...";
 const payload={email:document.getElementById("email").value.trim(),password:document.getElementById("password").value};
 if(registering){payload.name=document.getElementById("name").value.trim();payload.locationText=document.getElementById("locationText").value.trim();}
 try{
  const response=await fetch(registering?"/api/auth/register":"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const contentType=response.headers.get("content-type")||"";
  const responseText=await response.text();
  let data={};
  if(contentType.includes("application/json")){
   try{data=JSON.parse(responseText);}catch{throw new Error("The server returned invalid JSON. Please check the Render deployment logs.");}
  }else{
   const preview=responseText.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,180);
   throw new Error(`Login API returned HTML instead of JSON (HTTP ${response.status}). ${preview||"The backend may be unavailable or the API route is not being reached."} Check /api/health and the Render service logs.`);
  }
  if(!response.ok)throw new Error(data.message||`Login failed (HTTP ${response.status}).`);

  if(registering){statusEl.textContent=data.message;return;}
  sessionStorage.setItem("roadguard_token",data.token);
  sessionStorage.setItem("roadguard_user",JSON.stringify(data.user));
  window.location.href=data.user.role==="admin"?"admin.html":"dashboard.html";
 }catch(error){statusEl.textContent=error.message;}
});
</script></body></html>
